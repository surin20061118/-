;text-anchor:middle}.wheel-legend{font-size:13px;font-weight:800;text-align:center}.boxes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;width:min(100%,760px);margin:10px auto}.gift{height:96px;background:var(--pink);border:3px solid var(--brown);border-radius:15px;box-shadow:3px 4px 0 var(--brown);position:relative;font-size:30px;font-weight:900;transition:transform .2s}.gift:before{content:'✦';position:absolute;top:6px;left:8px;font-size:15px}.gift.selected{background:var(--yellow);transform:translateY(-6px);box-shadow:3px 10px 0 var(--brown)}.gift.open{background:var(--mint);font-size:21px;box-shadow:none;cursor:default}.gift.shake{animation:shake .12s 7}.key{font-size:76px;display:inline-block;filter:drop-shadow(2px 3px 0 #49352b55)}.key.turn{animation:keyturn 2.5s ease-in-out forwards}.student{background:var(--yellow);border:3px solid var(--brown);border-radius:999px;padding:12px 30px;font-size:clamp(21px,4vw,31px);font-weight:1000;box-shadow:4px 5px 0 var(--brown)}.slot-machine{background:var(--orange);border:5px solid var(--brown);border-radius:28px;padding:22px 26px 28px;box-shadow:8px 10px 0 var(--brown);max-width:500px;width:100%;text-align:center}.slot-machine .slot-top{font-weight:1000;font-size:30px;letter-spacing:3px}.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.reel{background:var(--paper);border:4px solid var(--brown);border-radius:14px;height:118px;display:flex;align-items:center;justify-content:center;font-size:clamp(48px,8vw,78px);font-weight:1000;font-variant-numeric:tabular-nums;overflow:hidden}.reel.rolling{animation:reelshake .11s linear infinite}.slot-footer{font-size:12px;font-weight:900;letter-spacing:2px}.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;width:100%;max-width:850px;margin:auto}.flip{height:110px;perspective:700px}.flip-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1)}.flip.revealed .flip-inner{transform:rotateY(180deg)}.flip-front,.flip-back{position:absolute;inset:0;border:3px solid var(--brown);border-radius:12px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:1000}.flip-front{background:var(--pink);font-size:35px}.flip-back{background:var(--mint);transform:rotateY(180deg);font-size:clamp(12px,2vw,20px)}.flip-back small{font-size:11px}.flip.shuffling{animation:carddance .35s ease-in-out infinite alternate}.flip.arrive{animation:flyCard .38s cubic-bezier(.18,1.2,.35,1) both}.flip.swap{transition:transform .15s ease}.gift.pop-open{animation:boxPop .4s ease-out}.shuffle-label{font-weight:1000;font-size:18px;color:#9d542e;text-align:center}@keyframes flyCard{from{opacity:0;transform:translateY(-170px) rotate(-15deg) scale(.45)}to{opacity:1;transform:translateY(0) rotate(0) scale(1)}}@keyframes boxPop{0%{transform:scale(1)}45%{transform:scale(1.16) rotate(4deg)}100%{transform:scale(1)}}.countdown{font-size:clamp(90px,18vw,175px);font-weight:1000;line-height:1;animation:pop .65s ease-in-out infinite alternate;color:var(--orange);-webkit-text-stroke:3px var(--brown);text-shadow:6px 7px 0 var(--yellow)}.celebrate{animation:pop .5s cubic-bezier(.2,1.8,.3,1)}.confetti{position:fixed;pointer-events:none;z-index:20;width:9px;height:15px;top:-25px;animation:fall 2.4s linear forwards}.pill{border:2px solid var(--brown);border-radius:999px;background:var(--mint);padding:6px 13px;font-weight:900}.footer{text-align:center;color:#9e7860;font-size:12px;padding-top:18px}.flash{position:fixed;inset:0;background:#fff7cb;opacity:0;pointer-events:none;z-index:15;animation:flash .5s ease-out}.instructions{font-weight:750;text-align:center;line-height:1.65;max-width:680px}.muted{color:#916d58;font-size:13px}.menu-bottom{text-align:center;margin-top:15px}@keyframes shake{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}@keyframes keyturn{0%{transform:rotate(-30deg) scale(.85)}40%{transform:rotate(15deg) scale(1.1)}65%{transform:rotate(-12deg)}100%{transform:rotate(90deg) scale(1.3)}}@keyframes reelshake{0%{transform:translateY(-3px)}100%{transform:translateY(3px)}}@keyframes carddance{0%{transform:translate(-5px,-7px) rotate(-5deg)}100%{transform:translate(6px,6px) rotate(5deg)}}@keyframes pop{from{transform:scale(.9)}to{transform:scale(1.08)}}@keyframes fall{to{transform:translateY(110vh) rotate(800deg);opacity:0}}@keyframes flash{15%{opacity:.65}100%{opacity:0}}@media(max-width:640px){.modes{gap:12px}.mode{padding:15px;min-height:160px}.mode .emoji{font-size:37px}.panel{padding:12px}.boxes{gap:6px}.gift{height:67px;font-size:22px}.cards{gap:5px}.flip{height:75px}.flip-front{font-size:25px}.seat{min-height:61px}.seat strong{font-size:12px}.top{align-items:flex-start}.btn.small{font-size:11px}}@media(prefers-reduced-motion:reduce){.flip-inner{transition-duration:.1s}.mode,.btn{transition:none}}

<section id="menu"><div class="menu-title"><div class="tag">WELCOME TO OUR CLASS</div><h1>자리 뽑기<br>파티!</h1><p id="classSummary">12명의 친구들 · 2줄 × 6자리 · 네 가지 게임</p></div><details class="panel class-config" id="classConfig"><summary>⚙️ 반 설정 · 학생 명단 / 자리 수 변경</summary><div class="config-fields"><div><label for="className">반 이름</label><input id="className" maxlength="60" placeholder="예: 화목한3-2"></div><div><label for="seatRows">줄 수 (앞뒤)</label><input id="seatRows" type="number" min="1" max="15" step="1"></div><div><label for="seatCols">한 줄 자리 수</label><input id="seatCols" type="number" min="1" max="15" step="1"></div></div><div class="config-names"><label for="studentNames" style="font-weight:900;font-size:13px">학생 이름 (한 줄에 한 명)</label><textarea id="studentNames" aria-label="학생 이름" placeholder="학생 이름을 한 줄에 한 명씩 입력하세요"></textarea></div><p class="config-help">학생 수만큼 또는 그보다 많은 자리를 설정하세요. 남는 자리는 빈자리로 표시됩니다. 최대 60명 / 60자리까지 가능합니다. 설정은 이 브라우저에 저장됩니다.</p><div class="config-actions"><button type="button" class="btn small orange" id="saveConfig">💾 저장하기</button><span class="config-help" id="configMessage" role="status"></span></div></details><div class="modes"><button class="mode" style="background:var(--yellow)" data-mode="wheel"><span class="emoji">🎡</span><strong>운명의 돌림판</strong><span>DOUBLE SPIN</span></button><button class="mode" style="background:var(--mint)" data-mode="shuffle"><span class="emoji">🔀</span><strong>자리 대혼란</strong><span>SHUFFLE PARTY</span></button><button class="mode" style="background:var(--pink)" data-mode="box"><span class="emoji">🎁</span><strong>미스터리 상자</strong><span>MYSTERY BOX</span></button><button class="mode" style="background:#ffba92" data-mode="slot"><span class="emoji">🎰</span><strong>행운의 777</strong><span>TRIPLE REEL</span></button></div><p class="menu-bottom muted">게임을 선택하면 새로운 자리 뽑기가 시작돼요.</p></section>
<section id="game" class="hidden"><div class="panel"><div class="gamehead"><button id="back" class="btn small">← 메뉴</button><h2 id="gameTitle"></h2><button id="restart" class="btn small pink">↻ 다시 시작</button></div><div id="status" class="status" aria-live="polite"></div><div id="stage" class="stage"></div><div id="actions" class="actions"></div><div id="result" class="result" aria-live="polite">준비됐나요?</div><p id="progress" class="progress"></p></div><div class="panel board-wrap"><h3>📍 우리 반 자리표</h3><div class="blackboard">칠판 · 앞쪽</div><div id="board" class="board"></div></div></section><div class="footer"><span id="classFooter">화목한3-2</span> · 함께하는 즐거운 자리 뽑기</div></main>
<script>
'use strict';
const DEFAULT_NAMES=['남현','금용','옥심','민지','혜경','하은','효예','수린','서준','금성','소월','강권'];
let NAMES=[...DEFAULT_NAMES],classTitle='화목한3-2',seatRows=2,seatCols=6;
const seatCount=()=>seatRows*seatCols;
function loadConfig(){try{const c=JSON.parse(localStorage.getItem('seatPartyClassConfigV1'));if(c&&typeof c.title==='string'&&Array.isArray(c.names)&&c.names.length&&c.names.length<=60&&new Set(c.names).size===c.names.length&&Number.isInteger(c.rows)&&Number.isInteger(c.cols)&&c.rows>=1&&c.cols>=1&&c.rows<=15&&c.cols<=15&&c.rows*c.cols>=c.names.length&&c.rows*c.cols<=60){classTitle=c.title||'우리 반';NAMES=c.names;seatRows=c.rows;seatCols=c.cols}}catch{}}
function updateClassUI(){$('classBrand').textContent=classTitle;$('classFooter').textContent=classTitle;$('classSummary').textContent=`${NAMES.length}명의 친구들 · ${seatRows}줄 × ${seatCols}자리 · 네 가지 게임`;$('className').value=classTitle;$('seatRows').value=seatRows;$('seatCols').value=seatCols;$('studentNames').value=NAMES.join('\n')}
function saveClassConfig(){const names=$('studentNames').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),r=Number($('seatRows').value),c=Number($('seatCols').value),title=$('className').value.trim()||'우리 반';const msg=$('configMessage');if(!Number.isInteger(r)||!Number.isInteger(c)||r<1||c<1||r>15||c>15){msg.textContent='줄 수와 한 줄 자리 수는 1~15 사이여야 해요.';return}if(!names.length||names.length>60||r*c>60||r*c<names.length){msg.textContent='학생은 1~60명, 자리는 학생 수 이상 60자리 이하로 설정해 주세요.';return}if(new Set(names).size!==names.length){msg.textContent='같은 이름이 있어요. 이름을 구분해서 입력해 주세요.';return}classTitle=title;NAMES=names;seatRows=r;seatCols=c;try{localStorage.setItem('seatPartyClassConfigV1',JSON.stringify({title,names,rows:r,cols:c}))}catch{}updateClassUI();reset();msg.textContent='저장됐어요!';$('classConfig').open=false}

const TITLES={wheel:'🎡 운명의 돌림판',shuffle:'🔀 자리 대혼란',box:'🎁 미스터리 상자',slot:'🎰 행운의 777'};
const $=id=>document.getElementById(id), sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rand=n=>{if(n<=0)throw Error('empty');const a=new Uint32Array(1);const max=Math.floor(4294967296/n)*n;let v;do{crypto.getRandomValues(a);v=a[0]}while(v>=max);return v%n};
const choose=a=>a[rand(a.length)];const shuffled=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let mode='',token=0,busy=false,assigned=Array(seatCount()).fill(null),remainingNames=[],remainingSeats=[],boxOrder=[],boxContents=[],opened=new Set(),chosenBox=-1,slotOrder=[],slotIndex=0,round=0;
let audio=null,sound=true,quickFinish=false;
function ctx(){if(!sound)return null;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}catch{return null}}
function tone(freq=440,dur=.1,type='square',vol=.055,delay=0){const a=ctx();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.001,vol),t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function clickSound(){tone(420,.075,'triangle',.07);tone(630,.07,'triangle',.045,.06)}function tick(){tone(180+rand(240),.045,'square',.022)}function lockSound(){tone(260,.12,'triangle',.075);tone(520,.14,'triangle',.07,.1)}function win(){[523,659,784,1047,784,1047].forEach((n,i)=>tone(n,.17,'triangle',.065,i*.13))}function drum(){tone(105,.13,'sawtooth',.025)}
function confetti(){const colors=['#ff8a4c','#ffd66b','#a8d8b9','#f6a9a1','#49352b'];for(let i=0;i<45;i++){const e=document.createElement('i');e.className='confetti';e.style.left=rand(100)+'vw';e.style.background=colors[rand(colors.length)];e.style.animationDelay=rand(500)+'ms';e.style.transform='rotate('+rand(360)+'deg)';document.body.append(e);setTimeout(()=>e.remove(),3300)}const f=document.createElement('div');f.className='flash';document.body.append(f);setTimeout(()=>f.remove(),600)}
function el(tag,cls='',txt=''){let x=document.createElement(tag);if(cls)x.className=cls;if(txt)x.textContent=txt;return x}
function setStatus(s){$('status').textContent=s}function setResult(s){$('result').textContent=s}function clearStage(){$('stage').replaceChildren();$('actions').replaceChildren()}
function button(text,fn,kind='orange'){const b=el('button','btn '+kind,text);b.addEventListener('click',()=>{clickSound();fn()});$('actions').append(b);return b}
function progress(){$('progress').textContent=`완료 ${assigned.filter(Boolean).length} / ${NAMES.length}`;renderBoard()}
function renderBoard(){const board=$('board');board.replaceChildren();board.style.gridTemplateColumns=`repeat(${seatCols},minmax(0,1fr))`;for(let i=0;i<seatCount();i++){const c=el('div','seat');c.style.background=i<seatCols?'var(--yellow)':'var(--mint)';c.append(el('b','',`${i+1}번`),el('strong','',assigned[i]||'???'));board.append(c)}}
function assign(name,seat){if(assigned[seat-1]!==null||assigned.includes(name))throw Error('duplicate');assigned[seat-1]=name;remainingNames=remainingNames.filter(x=>x!==name);remainingSeats=remainingSeats.filter(x=>x!==seat);progress()}
function finish(){busy=false;quickFinish=false;setStatus('🎉 모든 친구의 자리가 정해졌어요!');setResult('✨ 자리 뽑기 완료! 새로운 자리를 확인해 주세요.');$('actions').replaceChildren();button('다시 뽑기',()=>start(mode),'mint');win();confetti()}
function fillRest(){const ns=shuffled(remainingNames),ss=shuffled(remainingSeats);for(let i=0;i<ns.length;i++)assign(ns[i],ss[i]);}
function quickButton(fn){button('⚡ 한 번에 자리 뽑기',()=>{if(busy)return;quickFinish=true;fn()},'mint')}
function active(t){return t===token}function reset(){token++;busy=false;quickFinish=false;assigned=Array(seatCount()).fill(null);remainingNames=[...NAMES];remainingSeats=Array.from({length:seatCount()},(_,i)=>i+1);round=0;opened=new Set();chosenBox=-1;clearStage();progress();setResult('준비됐나요?')}
function start(m){mode=m;reset();$('menu').classList.add('hidden');$('game').classList.remove('hidden');$('gameTitle').textContent=TITLES[m];if(m==='wheel')setupWheel();if(m==='shuffle')setupShuffle();if(m==='box')setupBoxes();if(m==='slot')setupSlot()}
function countdown(t){return new Promise(async resolve=>{const d=el('div','countdown');$('stage').append(d);for(let i=3;i>=1;i--){if(!active(t))break;d.textContent=i;tone(300+(3-i)*130,.17,'square',.045);await sleep(720)}d.remove();resolve()})}
function showName(name){const x=el('div','student',name);$('stage').append(x);return x}
// Dual concentric wheel, with independent rings and fixed 12 segment geometry.
const NS='http://www.w3.org/2000/svg';function svg(tag,attrs={},txt){const x=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))x.setAttribute(k,v);if(txt!==undefined&&txt!==null)x.textContent=txt;return x}
function polar(r,a){return [250+r*Math.cos(a),250+r*Math.sin(a)]}function wedge(r0,r1,a0,a1){let p0=polar(r1,a0),p1=polar(r1,a1),q1=polar(r0,a1),q0=polar(r0,a0);return `M${p0} A${r1} ${r1} 0 0 1 ${p1} L${q1} A${r0} ${r0} 0 0 0 ${q0} Z`}
let wheelInner,wheelOuter,angleInner=0,angleOuter=0;
function buildWheel(){const frame=el('div','wheel-frame'),s=svg('svg',{viewBox:'0 0 500 500',role:'img','aria-label':'안쪽 이름 돌림판과 바깥쪽 자리 번호 돌림판'});wheelOuter=svg('g',{class:'wheel-layer'});wheelInner=svg('g',{class:'wheel-layer'});const colors=['#ffd66b','#f6a9a1','#a8d8b9','#ffb98b'];for(let i=0;i<seatCount();i++){const step=2*Math.PI/seatCount(),a0=-Math.PI/2+(i-.5)*step,a1=a0+step,mid=(a0+a1)/2;wheelOuter.append(svg('path',{d:wedge(177,240,a0,a1),fill:colors[i%4],stroke:'#49352b','stroke-width':2}));const [x,y]=polar(209,mid);wheelOuter.append(svg('text',{x,y,class:'wheel-label','font-size':Math.max(7,Math.min(19,240/seatCount())),transform:`rotate(${mid*180/Math.PI+90} ${x} ${y})`},String(i+1)))}for(let i=0;i<NAMES.length;i++){const step=2*Math.PI/NAMES.length,a0=-Math.PI/2+(i-.5)*step,a1=a0+step,mid=(a0+a1)/2;wheelInner.append(svg('path',{d:wedge(40,175,a0,a1),fill:colors[(i+2)%4],stroke:'#49352b','stroke-width':2}));const [nx,ny]=polar(116,mid);wheelInner.append(svg('text',{x:nx,y:ny,class:'wheel-label','font-size':Math.max(7,Math.min(17,200/NAMES.length)),transform:`rotate(${mid*180/Math.PI+90} ${nx} ${ny})`},NAMES[i]))}s.append(wheelOuter,wheelInner,svg('circle',{cx:250,cy:250,r:39,class:'center-disk'}),svg('text',{x:250,y:257,class:'wheel-center-label'},'GO!'));s.append(svg('path',{d:'M250 7 L236 -19 L264 -19 Z',class:'wheel-pointer'}),svg('path',{d:'M250 66 L239 45 L261 45 Z',class:'wheel-pointer'}));frame.append(s);$('stage').append(frame);$('stage').append(el('div','wheel-legend','▲ 바깥쪽: 자리 번호   ·   ▲ 안쪽: 친구 이름'))}
function targetAngle(current,index,turns,direction,count){const desired=(360-index*360/count)%360;let diff=((desired-(current%360))%360+360)%360;if(direction<0)diff=diff===0?0:diff-360;return current+direction*turns*360+diff}
function spinRing(g,from,to,duration){return new Promise(resolve=>{const a=g.animate([{transform:`rotate(${from}deg)`},{transform:`rotate(${to}deg)`}],{duration,easing:'cubic-bezier(.13,.72,.12,1)',fill:'forwards'});a.onfinish=()=>{g.style.transform=`rotate(${to}deg)`;a.cancel();resolve()};a.oncancel=resolve})}
function setupWheel(){setStatus('안쪽은 이름, 바깥쪽은 자리 번호예요.');clearStage();buildWheel();button('두 바퀴 돌리기!',wheelRound);quickButton(wheelRound);progress()}
async function wheelRound(){if(busy||!remainingNames.length)return;busy=true;const t=token;const name=choose(remainingNames),seat=choose(remainingSeats),ni=NAMES.indexOf(name),si=seat-1;setResult('누가 어떤 자리에 앉게 될까요?');$('actions').replaceChildren();setStatus('두 바퀴가 동시에 돌아갑니다!');const inTo=targetAngle(angleInner,ni,6,1,NAMES.length),outTo=targetAngle(angleOuter,si,9,-1,seatCount());const a=spinRing(wheelInner,angleInner,inTo,4700),b=spinRing(wheelOuter,angleOuter,outTo,8200);const tickTimer=setInterval(()=>{if(active(t))tick()},150);await a;clearInterval(tickTimer);if(!active(t))return;angleInner=inTo;lockSound();setStatus(`안쪽 멈춤! ${name} · 바깥쪽은 계속 회전 중...`);setResult(`👤 ${name} · 자리 번호는 아직 비밀!`);const ticking=setInterval(()=>{if(active(t))tick()},340);await b;clearInterval(ticking);if(!active(t))return;angleOuter=outTo;assign(name,seat);if(quickFinish)fillRest();setStatus('두 바퀴 모두 멈췄어요!');setResult(`🎉 ${name} → ${seat}번 자리!`);win();confetti();busy=false;if(!remainingNames.length){finish();return}button('다음 친구 뽑기',wheelRound,'mint');quickButton(wheelRound)}
// Mystery boxes: choose a box, shake briefly, reveal its number immediately.
function setupBoxes(){boxOrder=shuffled(NAMES);boxContents=shuffled(Array.from({length:seatCount()},(_,i)=>i+1));nextBoxTurn()}
function renderBoxes(){const stage=$('stage');stage.replaceChildren();const name=quickFinish?classTitle:boxOrder[round];stage.append(el('div','student',name));const grid=el('div','boxes');grid.style.gridTemplateColumns=`repeat(${Math.min(6,seatCount())},minmax(0,1fr))`;for(let i=0;i<seatCount();i++){const b=el('button','gift'+(opened.has(i)?' open':'')+(chosenBox===i?' selected':''),opened.has(i)?`${boxContents[i]}번`:'🎁');b.disabled=opened.has(i)||busy;b.title=`${i+1}번 상자`;b.dataset.index=i;b.addEventListener('click',()=>{if(busy||opened.has(i))return;clickSound();chosenBox=i;openBox()});grid.append(b)}stage.append(grid)}
function nextBoxTurn(){if(!remainingNames.length){finish();return}chosenBox=-1;renderBoxes();const name=boxOrder[round];setStatus(`이번 차례: ${name} · 원하는 상자를 눌러 주세요!`);setResult(`${name}의 비밀 자리는 어느 상자에 있을까요?`);$('actions').replaceChildren();quickButton(openAllBoxes)}
async function openBox(){if(busy||chosenBox<0)return;busy=true;const t=token,index=chosenBox,name=boxOrder[round],seat=boxContents[index];$('actions').replaceChildren();setStatus(`이번 차례: ${name} · 상자가 흔들리고 있어요!`);const selected=$('stage').querySelector(`.gift[data-index="${index}"]`);$('stage').querySelectorAll('.gift').forEach(b=>b.disabled=true);selected?.classList.add('shake');for(let i=0;i<5;i++){if(!active(t))return;if(i%2===0)tick();await sleep(115)}if(!active(t))return;selected?.classList.remove('shake');selected?.classList.add('open','pop-open');selected.textContent=`${seat}번`;lockSound();opened.add(index);assign(name,seat);round++;chosenBox=-1;setStatus(`🎁 ${name}의 상자가 열렸어요!`);setResult(`🎁 ${name} → ${seat}번 자리!`);win();confetti();busy=false;if(!remainingNames.length){finish();return}button('다음 친구',nextBoxTurn,'mint');quickButton(openAllBoxes)}
async function openAllBoxes(){if(busy||!remainingSeats.length)return;busy=true;quickFinish=true;const t=token;const stage=$('stage');stage.replaceChildren();stage.append(el('div','student',classTitle));const grid=el('div','boxes');grid.style.gridTemplateColumns=`repeat(${Math.min(6,seatCount())},minmax(0,1fr))`;const available=Array.from({length:12},(_,i)=>i).filter(i=>!opened.has(i));for(let i=0;i<seatCount();i++){const b=el('button','gift'+(opened.has(i)?' open':''),opened.has(i)?`${boxContents[i]}번`:'🎁');b.disabled=true;b.dataset.index=i;grid.append(b)}stage.append(grid);$('actions').replaceChildren();setStatus(`${classTitle} · 모든 상자가 동시에 열립니다!`);setResult('두근두근! 모든 상자를 확인해 보세요!');await sleep(220);if(!active(t))return;available.forEach(i=>grid.children[i].classList.add('shake'));for(let k=0;k<6;k++){if(!active(t))return;tick();await sleep(115)}if(!active(t))return;const names=shuffled(remainingNames);available.forEach((i,j)=>{const b=grid.children[i];b.classList.remove('shake');b.classList.add('open','pop-open');b.textContent=`${boxContents[i]}번`;opened.add(i);if(j<names.length)assign(names[j],boxContents[i])});round=NAMES.length;lockSound();setStatus(`${classTitle} · 모든 상자가 열렸어요!`);setResult(`🎁 ${seatCount()}개의 상자에서 모든 자리 번호가 공개됐어요!`);confetti();await sleep(1100);if(active(t))finish()}
// 777: lock the student first, then sequentially stop 3 genuine digit reels.
let reelEls=[];function setupSlot(){slotOrder=shuffled(NAMES);slotIndex=0;nextSlotTurn()}
function nextSlotTurn(){if(slotIndex>=NAMES.length){finish();return}clearStage();const name=slotOrder[slotIndex];showName(name);const machine=el('div','slot-machine');machine.append(el('div','slot-top','★ 777 ★'));const reels=el('div','reels');reelEls=[];for(let i=0;i<3;i++){const viewport=el('div','reel reel-window');const strip=el('div','digit-strip');for(let j=0;j<70;j++)strip.append(el('div','digit',String(j%10)));viewport.append(strip);reelEls.push(strip);reels.append(viewport)}machine.append(reels,el('div','slot-footer','행운의 자리 추첨기'));$('stage').append(machine);setStatus(`이번 차례: ${name} · 직접 시작 버튼을 눌러 주세요!`);setResult(`${name}의 행운의 자리 번호는?`);$('actions').replaceChildren();button('▶ 시작!',spinSlot);quickButton(spinSlot)}
async function spinSlot(){if(busy)return;busy=true;const t=token,name=slotOrder[slotIndex],seat=choose(remainingSeats),digits=String(seat).padStart(3,'0').split('').map(Number);$('actions').replaceChildren();if(quickFinish){const nameBadge=$('stage').querySelector('.student');if(nameBadge)nameBadge.textContent=classTitle;setStatus(`${classTitle} · 한 번에 자리를 뽑는 중!`)}else setStatus('세 개의 숫자판이 진짜 슬롯처럼 아래로 돌아갑니다!');setResult('두근두근... 어떤 숫자가 나올까요?');const durations=[2200,3400,4800];const animations=reelEls.map((strip,i)=>{const unit=90;const finishAt=(40+digits[i])*unit;const a=strip.animate([{transform:'translateY(0px)'},{transform:`translateY(-${finishAt}px)`}],{duration:durations[i],easing:'cubic-bezier(.12,.8,.19,1)',fill:'forwards'});return a});let running=true;const sounds=setInterval(()=>{if(active(t)&&running)tick()},105);for(let i=0;i<3;i++){try{await animations[i].finished}catch{return}if(!active(t)){clearInterval(sounds);return}reelEls[i].style.transform=`translateY(-${(40+digits[i])*90}px)`;animations[i].cancel();lockSound();setStatus(`${i+1}번째 숫자 확정! ${i===2?'마지막 숫자까지 완료!':'다음 숫자는...? '}`)}running=false;clearInterval(sounds);if(!active(t))return;assign(name,seat);if(quickFinish)fillRest();setResult(quickFinish?`🎰 ${classTitle} · 모든 자리 추첨 완료!`:`🎰 ${name} → ${String(seat).padStart(3,'0')}번 자리!`);win();confetti();slotIndex++;busy=false;if(!remainingNames.length){finish();return}button('다음 친구',nextSlotTurn,'mint');quickButton(spinSlot)}
// Whole-class shuffle: 12 fly-in cards, three escalating phases, freeze, countdown, sequential reveals.
// The shuffle follows the user's uploaded "座位.html" version: two speed phases,
// abrupt stop, 3-2-1 countdown, and twelve successive card reveals.
function setupShuffle(){clearStage();renderShuffleCards();setStatus(`${NAMES.length}명의 자리가 뒤섞입니다!`);setResult('준비가 되면 SHUFFLE! 버튼을 눌러 주세요.');button('🔀 SHUFFLE!',shuffleRound);quickButton(shuffleRound);progress()}
function renderShuffleCards(){const grid=el('div','cards');grid.id='shuffleCards';grid.style.gridTemplateColumns=`repeat(${Math.min(6,NAMES.length)},minmax(0,1fr))`;NAMES.forEach(n=>{const c=el('div','flip');c.innerHTML='<div class="flip-inner"><div class="flip-front"></div><div class="flip-back"><small></small><span></span></div></div>';c.querySelector('.flip-front').textContent=n;grid.append(c)});$('stage').append(grid);return grid}
async function shuffleRound(){if(busy)return;busy=true;const t=token;$('actions').replaceChildren();setResult('누가 어디에 앉을까요?');await countdown(t);if(!active(t))return;const grid=$('shuffleCards'),cards=[...grid.children];let id=null;function stop(){if(id!==null){clearInterval(id);id=null}}function mix(delay,fast){id=setInterval(()=>{if(!active(t)){stop();return}const names=shuffled(NAMES);cards.forEach((c,i)=>{c.querySelector('.flip-front').textContent=names[i];c.querySelector('.flip-front').style.background=['#ffd66b','#a8d8b9','#f6a9a1','#ffb78f'][rand(4)]});tick();if(fast&&rand(3)===0)drum()},delay)}
setStatus('1단계 · 카드 섞기!');cards.forEach(c=>c.classList.add('shuffling'));mix(230,false);await sleep(2200);stop();if(!active(t))return;setStatus('2단계 · 초고속 섞기!');mix(90,true);await sleep(3000);stop();if(!active(t))return;cards.forEach(c=>{c.classList.remove('shuffling');c.querySelector('.flip-front').textContent='❔';c.querySelector('.flip-front').style.background='#f6a9a1'});const result=shuffled(NAMES);setStatus('멈췄습니다!');setResult('이제 운명의 카드를 공개합니다…');await sleep(650);if(!active(t))return;for(let i=3;i>=1;i--){setStatus(`공개까지 ${i}…`);tone(460+i*120,.17,'triangle',.05);await sleep(700);if(!active(t))return}setStatus('3단계 · 자리 공개!');for(let i=0;i<NAMES.length;i++){if(!active(t))return;cards[i].querySelector('.flip-back small').textContent=`${i+1}번`;cards[i].querySelector('.flip-back span').textContent=result[i];cards[i].classList.add('revealed');assign(result[i],i+1);tone(530+i*28,.1,'triangle',.055);await sleep(260)}if(active(t)){setResult(`🎉 ${NAMES.length}명의 새로운 자리가 모두 공개됐어요!`);finish()}}
loadConfig();updateClassUI();$('saveConfig').addEventListener('click',saveClassConfig);$('soundBtn').addEventListener('click',()=>{sound=!sound;$('soundBtn').textContent=sound?'🔊 소리 켜짐':'🔇 소리 꺼짐';$('soundBtn').setAttribute('aria-pressed',String(sound));if(sound)clickSound()});document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{clickSound();start(b.dataset.mode)}));$('back').addEventListener('click',()=>{clickSound();reset();$('game').classList.add('hidden');$('menu').classList.remove('hidden')});$('restart').addEventListener('click',()=>{clickSound();start(mode)});progress();
</script></body></html>
