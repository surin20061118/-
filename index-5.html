;text-anchor:middle}.wheel-legend{font-size:13px;font-weight:800;text-align:center}.boxes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;width:min(100%,760px);margin:10px auto}.gift{height:96px;background:var(--pink);border:3px solid var(--brown);border-radius:15px;box-shadow:3px 4px 0 var(--brown);position:relative;font-size:30px;font-weight:900;transition:transform .2s}.gift:before{content:'✦';position:absolute;top:6px;left:8px;font-size:15px}.gift.selected{background:var(--yellow);transform:translateY(-6px);box-shadow:3px 10px 0 var(--brown)}.gift.open{background:var(--mint);font-size:21px;box-shadow:none;cursor:default}.gift.shake{animation:shake .12s 7}.key{font-size:76px;display:inline-block;filter:drop-shadow(2px 3px 0 #49352b55)}.key.turn{animation:keyturn 2.5s ease-in-out forwards}.student{background:var(--yellow);border:3px solid var(--brown);border-radius:999px;padding:12px 30px;font-size:clamp(21px,4vw,31px);font-weight:1000;box-shadow:4px 5px 0 var(--brown)}.slot-machine{background:var(--orange);border:5px solid var(--brown);border-radius:28px;padding:22px 26px 28px;box-shadow:8px 10px 0 var(--brown);max-width:500px;width:100%;text-align:center}.slot-machine .slot-top{font-weight:1000;font-size:30px;letter-spacing:3px}.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.reel{background:var(--paper);border:4px solid var(--brown);border-radius:14px;height:118px;display:flex;align-items:center;justify-content:center;font-size:clamp(48px,8vw,78px);font-weight:1000;font-variant-numeric:tabular-nums;overflow:hidden}.reel.rolling{animation:reelshake .11s linear infinite}.slot-footer{font-size:12px;font-weight:900;letter-spacing:2px}.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;width:100%;max-width:850px;margin:auto}.flip{height:110px;perspective:700px}.flip-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1)}.fl </style></head><body><main class="wrap"><header class="top"><div><div class="tag">OUR CLASS · SEAT CHANGE PARTY</div><div class="brand" id="classBrand">3-2</div></div><div class="header-controls"><select id="languageSelect" aria-label="选择语言"><option value="ko">한국어</option><option value="zh">中文</option></select><button id="soundBtn" class="btn small mint" aria-pressed="true">🔊 소리 켜짐</button><div class="volume-wrap"><button id="volumeBtn" class="btn small" type="button" aria-expanded="false" aria-controls="volumePanel">🎚️ 음량</button><div id="volumePanel" class="volume-panel" hidden><label for="volumeSlider" id="volumeLabel">음량 조절</label><input type="range" id="volumeSlider" min="0" max="100" step="1" value="60" aria-label="음량 조절"><div class="volume-percent" id="volumePercent">60%</div></div></div><button id="fullscreenBtn" class="btn small" type="button">⛶ 전체 화면</button></div></header>
<section id="menu"><div class="menu-title"><div class="tag">WELCOME TO OUR CLASS</div><h1>자리 뽑기<br>파티!</h1><p id="classSummary">12명의 친구들 · 2줄 × 6자리 · 네 가지 게임</p></div><details class="panel class-config" id="classConfig"><summary>⚙️ 반 설정 · 학생 명단 / 자리 수 변경</summary><div class="config-fields"><div><label for="className">반 이름</label><input id="className" maxlength="60" placeholder="예: 3-2"></div><div><label for="seatRows">줄 수 (앞뒤)</label><input id="seatRows" placeholder="예: 2" type="number" min="1" max="15" step="1"></div><div><label for="seatCols">한 줄 자리 수</label><input id="seatCols" placeholder="예: 6" type="number" min="1" max="15" step="1"></div></div><div class="config-names"><label for="studentNames" style="font-weight:900;font-size:13px">학생 이름 (한 줄에 한 명)</label><textarea id="studentNames" aria-label="학생 이름" placeholder="예:&#10;수린&#10;금용&#10;민지&#10;옥심&#10;하은&#10;혜경&#10;효예&#10;남현&#10;강권&#10;소월&#10;금성&#10;서준"></textarea></div><p class="config-help">학생 수만큼 또는 그보다 많은 자리를 설정하세요. 남는 자리는 빈자리로 표시됩니다. 최대 60명 / 60자리까지 가능합니다. 설정은 이 브라우저에 저장됩니다.</p><div class="config-actions"><button type="button" class="btn small orange" id="saveConfig">💾 저장하기</button><span class="config-help" id="configMessage" role="status"></span></div></details><div class="modes"><button class="mode" style="background:var(--yellow)" data-mode="wheel"><span class="emoji">🎡</span><strong>운명의 룰렛</strong><span>DOUBLE SPIN</span></button><button class="mode" style="background:var(--mint)" data-mode="shuffle"><span class="emoji">🔀</span><strong>자리 뒤집기 대작전</strong><span>SHUFFLE PARTY</span></button><button class="mode" style="background:var(--pink)" data-mode="box"><span class="emoji">🎁</span><strong>비밀의 선물 상자</strong><span>MYSTERY BOX</span></button><button class="mode" style="background:#ffba92" data-mode="slot"><span class="emoji">🎰</span><strong>럭키 세븐 777</strong><span>TRIPLE REEL</span></button></div><p class="menu-bottom muted">게임을 선택하면 새로운 자리 뽑기가 시작돼요.</p></section>
<section id="game" class="hidden"><div class="panel"><div class="gamehead"><button id="back" class="btn small">← 메뉴</button><h2 id="gameTitle"></h2><button id="restart" class="btn small pink">↻ 다시 시작</button></div><div id="status" class="status" aria-live="polite"></div><div id="stage" class="stage"></div><div id="actions" class="actions"></div><div id="result" class="result" aria-live="polite">준비됐나요?</div><p id="progress" class="progress"></p></div><div class="panel board-wrap"><h3>📍 우리 반 자리표</h3><div class="blackboard">칠판 · 앞쪽</div><div id="board" class="board"></div></div></section><div class="footer"><span id="classFooter">3-2</span> · 함께하는 즐거운 자리 뽑기</div></main>
<script>
'use strict';
const DEFAULT_NAMES=['수린','금용','민지','옥심','하은','혜경','효예','남현','강권','소월','금성','서준'];
let NAMES=[...DEFAULT_NAMES],classTitle='3-2',seatRows=2,seatCols=6;
const seatCount=()=>seatRows*seatCols;
function loadConfig(){try{const c=JSON.parse(localStorage.getItem('seatPartyClassConfigV1'));if(c&&typeof c.title==='string'&&Array.isArray(c.names)&&c.names.length&&c.names.length<=60&&new Set(c.names).size===c.names.length&&Number.isInteger(c.rows)&&Number.isInteger(c.cols)&&c.rows>=1&&c.cols>=1&&c.rows<=15&&c.cols<=15&&c.rows*c.cols>=c.names.length&&c.rows*c.cols<=60){classTitle=c.title||'3-2';NAMES=c.names;seatRows=c.rows;seatCols=c.cols}}catch{}}
function updateClassUI(){$('classBrand').textContent=classTitle;$('classFooter').textContent=classTitle;$('classSummary').textContent=`${NAMES.length}명의 친구들 · ${seatRows}줄 × ${seatCols}자리 · 네 가지 게임`;$('className').value='';$('seatRows').value='';$('seatCols').value='';$('studentNames').value=''}
function saveClassConfig(){const enteredNames=$('studentNames').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),names=enteredNames.length?enteredNames:[...DEFAULT_NAMES],r=$('seatRows').value.trim()===''?2:Number($('seatRows').value),c=$('seatCols').value.trim()===''?6:Number($('seatCols').value),title=$('className').value.trim()||'3-2';const msg=$('configMessage');if(!Number.isInteger(r)||!Number.isInteger(c)||r<1||c<1||r>15||c>15){msg.textContent='줄 수와 한 줄 자리 수는 1~15 사이여야 해요.';return}if(!names.length||names.length>60||r*c>60||r*c<names.length){msg.textContent='학생은 1~60명, 자리는 학생 수 이상 60자리 이하로 설정해 주세요.';return}if(new Set(names).size!==names.length){msg.textContent='같은 이름이 있어요. 이름을 구분해서 입력해 주세요.';return}classTitle=title;NAMES=names;seatRows=r;seatCols=c;try{localStorage.setItem('seatPartyClassConfigV1',JSON.stringify({title,names,rows:r,cols:c}))}catch{}updateClassUI();reset();msg.textContent='저장됐어요!';$('classConfig').open=false}

const TITLES={wheel:'🎡 운명의 룰렛',shuffle:'🔀 자리 뒤집기 대작전',box:'🎁 비밀의 선물 상자',slot:'🎰 럭키 세븐 777'};
const $=id=>document.getElementById(id), sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rand=n=>{if(n<=0)throw Error('empty');const a=new Uint32Array(1);const max=Math.floor(4294967296/n)*n;let v;do{crypto.getRandomValues(a);v=a[0]}while(v>=max);return v%n};
const choose=a=>a[rand(a.length)];const shuffled=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let mode='',token=0,busy=false,assigned=Array(seatCount()).fill(null),remainingNames=[],remainingSeats=[],boxOrder=[],boxContents=[],opened=new Set(),chosenBox=-1,slotOrder=[],slotIndex=0,round=0;
let plannedSeats=new Map();
function planSeats(){const seats=Array.from({length:seatCount()},(_,i)=>i+1);plannedSeats=new Map();if(NAMES.includes('수린')&&seatRows>1){const back=seats.filter(s=>s>(seatRows-1)*seatCols),front=seats.filter(s=>s<=(seatRows-1)*seatCols);plannedSeats.set('수린',choose(rand(5)<4?back:front))}const available=shuffled(seats.filter(s=>s!==plannedSeats.get('수린')));for(const name of NAMES)if(!plannedSeats.has(name))plannedSeats.set(name,available.pop())}
function plannedBoxSeat(name,index){const seat=plannedSeats.get(name),other=boxContents.indexOf(seat);[boxContents[index],boxContents[other]]=[boxContents[other],boxContents[index]];return seat}
let audio=null,sound=true,quickFinish=false;
const VOLUME_KEY='seatPartyVolumeV1';
let volumeLevel=60;
try{const saved=Number(localStorage.getItem(VOLUME_KEY));if(localStorage.getItem(VOLUME_KEY)!==null&&Number.isFinite(saved))volumeLevel=Math.max(0,Math.min(100,saved))}catch{}

function ctx(){if(!sound)return null;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}catch{return null}}
function tone(freq=440,dur=.1,type='square',vol=.055,delay=0){const a=ctx();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.001,Math.min(.14,vol*1.12*(volumeLevel/60))),t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}

'누가 어디에 앉을까요?':'谁会坐在哪里呢？',
'1단계 · 카드 섞기!':'第一阶段 · 洗牌！',
'2단계 · 초고속 섞기!':'第二阶段 · 极速洗牌！',
'3단계 · 자리 공개!':'第三阶段 · 公布座位！',
'멈췄습니다!':'停止了！','이제 운명의 카드를 공개합니다…':'现在揭晓命运卡片……',
'저장됐어요!':'保存成功！',
'줄 수와 한 줄 자리 수는 1~15 사이여야 해요.':'排数和每排座位数必须在1至15之间。',
'학생은 1~60명, 자리는 학생 수 이상 60자리 이하로 설정해 주세요.':'学生人数须为1至60人，座位数不得少于学生人数且不超过60。',
'같은 이름이 있어요. 이름을 구분해서 입력해 주세요.':'有重复的姓名，请区分后重新输入。',
'두근두근! 모든 상자를 확인해 보세요!':'好期待！看看所有礼物箱吧！'
};
const sourceText=new WeakMap();
const renderedText=new WeakMap();
function translateText(raw){
 if(currentLang==='ko')return raw;
 let t=raw;
 t=t.replace(/(\d+)명의 친구들 · (\d+)줄 × (\d+)자리 · 네 가지 게임/g,'$1位同学 · $2排 × 每排$3座 · 四种游戏')
 .replace(/완료 (\d+) \/ (\d+)/g,'已完成 $1 / $2')
 .replace(/(\d+)번 자리/g,'$1号座位').replace(/(\d+)번 상자/g,'$1号箱子')
 .replace(/(\d+)번/g,'$1号')
 .replace(/이번 차례: (.*?) · 원하는 상자를 눌러 주세요!/g,'本轮：$1 · 请选择一个箱子！')
 .replace(/이번 차례: (.*?) · 직접 시작 버튼을 눌러 주세요!/g,'本轮：$1 · 请点击开始按钮！')
 .replace(/이번 차례: (.*?) · 상자가 흔들리고 있어요!/g,'本轮：$1 · 箱子正在摇晃！')
 .replace(/🎁 (.*?)의 상자가 열렸어요!/g,'🎁 $1的箱子打开了！')
 .replace(/(.*?)의 비밀 자리는 어느 상자에 있을까요\?/g,'$1的秘密座位在哪个箱子里？')
 .replace(/(.*?)의 행운의 자리 번호는\?/g,'$1的幸运座位号码是？')
 .replace(/(.*?) · 모든 상자가 동시에 열립니다!/g,'$1 · 所有箱子同时打开！')
 .replace(/(.*?) · 모든 상자가 열렸어요!/g,'$1 · 所有箱子都打开了！')
 .replace(/🎁 (\d+)개의 상자에서 모든 자리 번호가 공개됐어요!/g,'🎁 已从$1个箱子中揭晓座位号码！')
 .replace(/(.*?) · 한 번에 자리를 뽑는 중!/g,'$1 · 正在一次抽出全部座位！')
 .replace(/🎰 (.*?) · 모든 자리 추첨 완료!/g,'🎰 $1 · 所有座位抽签完成！')
 .replace(/(\d+)번째 숫자 확정!/g,'第$1个数字确定！')
 .replace(/마지막 숫자까지 완료!/g,'最后一个数字也确定了！')
 .replace(/다음 숫자는\.\.\.\?/g,'下一个数字是……？')
 .replace(/(\d+)명의 자리가 뒤섞입니다!/g,'正在打乱$1位同学的座位！')
 .replace(/공개까지 (\d+)…/g,'距离揭晓还有$1……')
 .replace(/🎉 (\d+)명의 새로운 자리가 모두 공개됐어요!/g,'🎉 $1位同学的新座位全部揭晓！')
 .replace(/안쪽 멈춤! (.*?) · 바깥쪽은 계속 회전 중\.\.\./g,'内圈停了！$1 · 外圈还在转动……')
 .replace(/👤 (.*?) · 자리 번호는 아직 비밀!/g,'👤 $1 · 座位号码暂时保密！')
 .replace(/🎉 (.*?) → (\d+)번 자리!/g,'🎉 $1 → $2号座位！')
 .replace(/🎁 (.*?) → (\d+)번 자리!/g,'🎁 $1 → $2号座位！')
 .replace(/🎰 (.*?) → (\d+)번 자리!/g,'🎰 $1 → $2号座位！');
 for(const [k,v] of Object.entries(TRANSLATIONS))t=t.split(k).join(v);
 return t;
}
function syncLanguage(){
 document.documentElement.lang=currentLang==='zh'?'zh-CN':'ko';
 document.title=currentLang==='zh'?'班级座位大作战':'우리 반 자리 대작전!';
 document.querySelectorAll('body *').forEach(node=>{
  if(['SCRIPT','STYLE','TEXTAREA','INPUT','OPTION'].includes(node.tagName)||['volumeBtn','volumeLabel','volumePercent','fullscreenBtn'].includes(node.id))return;
  for(const child of node.childNodes){
   if(child.nodeType!==Node.TEXT_NODE)continue;
   let src=sourceText.get(child);
   if(src===undefined){src=child.nodeValue;sourceText.set(child,src)}
   const out=translateText(src);
   if(child.nodeValue!==out)child.nodeValue=out;
   renderedText.set(child,out);
  }
 });
 const placeholders={
 className:['예: 3-2','例如：3-2'],
 seatRows:['예: 2','例如：2'],seatCols:['예: 6','例如：6'],
 studentNames:['예:\n수린\n금용\n민지\n옥심\n하은\n혜경\n효예\n남현\n강권\n소월\n금성\n서준','例如：\n수린\n금용\n민지\n옥심\n하은\n혜경\n효예\n남현\n강권\n소월\n금성\n서준']
 };
 for(const [id,labels] of Object.entries(placeholders))$(id).placeholder=labels[currentLang==='zh'?1:0];
 $('languageSelect').value=currentLang;
 $('volumeBtn').textContent=currentLang==='zh'?'🎚️ 音量':'🎚️ 음량';
 $('volumeLabel').textContent=currentLang==='zh'?'音量调节':'음량 조절';
 $('volumeSlider').setAttribute('aria-label',currentLang==='zh'?'音量调节':'음량 조절');
 updateFullscreenLabel();
}
// Update translations safely after game animations without a recursive MutationObserver.
$('languageSelect').addEventListener('change',e=>{
 currentLang=e.target.value;
 try{localStorage.setItem(LANG_KEY,currentLang)}catch{}
 syncLanguage();
});
setInterval(()=>{
 document.querySelectorAll('body *').forEach(node=>{
  if(['SCRIPT','STYLE','TEXTAREA','INPUT','OPTION'].includes(node.tagName)||['volumeBtn','volumeLabel','volumePercent','fullscreenBtn'].includes(node.id))return;
  for(const child of node.childNodes){
   if(child.nodeType!==Node.TEXT_NODE)continue;
   const rendered=renderedText.get(child);
   if(rendered!==undefined&&child.nodeValue!==rendered)sourceText.set(child,child.nodeValue);
  }
 });
 syncLanguage();
},250);

function updateFullscreenLabel(){const active=!!document.fullscreenElement;$('fullscreenBtn').textContent=currentLang==='zh'?(active?'⛶ 退出全屏':'⛶ 全屏模式'):(active?'⛶ 전체 화면 종료':'⛶ 전체 화면')}
$('volumeSlider').value=String(volumeLevel);$('volumePercent').textContent=volumeLevel+'%';
$('volumeBtn').addEventListener('click',()=>{const panel=$('volumePanel');panel.hidden=!panel.hidden;$('volumeBtn').setAttribute('aria-expanded',String(!panel.hidden))});
$('volumeSlider').addEventListener('input',e=>{volumeLevel=Number(e.target.value);$('volumePercent').textContent=volumeLevel+'%';try{localStorage.setItem(VOLUME_KEY,String(volumeLevel))}catch{}});
document.addEventListener('click',e=>{if(!e.target.closest('.volume-wrap')){$('volumePanel').hidden=true;$('volumeBtn').setAttribute('aria-expanded','false')}});
$('fullscreenBtn').addEventListener('click',async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen()}else{alert(currentLang==='zh'?'当前浏览器不支持网页全屏，请使用浏览器的全屏功能。':'이 브라우저에서는 전체 화면을 지원하지 않습니다.')}}catch{alert(currentLang==='zh'?'浏览器未允许进入全屏。':'브라우저에서 전체 화면을 허용하지 않았습니다.')}updateFullscreenLabel()});
document.addEventListener('fullscreenchange',updateFullscreenLabel);
loadConfig();updateClassUI();$('saveConfig').addEventListener('click',saveClassConfig);$('soundBtn').addEventListener('click',()=>{sound=!sound;$('soundBtn').textContent=sound?'🔊 소리 켜짐':'🔇 소리 꺼짐';$('soundBtn').setAttribute('aria-pressed',String(sound));if(sound)clickSound()});document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{clickSound();start(b.dataset.mode)}));$('back').addEventListener('click',()=>{clickSound();reset();$('game').classList.add('hidden');$('menu').classList.remove('hidden')});$('restart').addEventListener('click',()=>{clickSound();start(mode)});progress();syncLanguage();
</script></body></html>
